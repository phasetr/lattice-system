name = "LatticeSystem"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LatticeSystem"]

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longFile = 1500
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[lean_lib]]
name = "LatticeSystem"

# Verification infrastructure is an explicit target, separate from the mathematical default.
[[lean_lib]]
name = "Checker"

[[lean_exe]]
name = "checker"
root = "Checker.Main"
