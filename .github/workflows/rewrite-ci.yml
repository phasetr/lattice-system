name: rewrite-ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Structural checks and checker self-tests
        run: scripts/check-all.sh
      - name: Base-diff regression checks
        run: scripts/check-base-diff.sh . "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
      - name: Build empty production root
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build: true
