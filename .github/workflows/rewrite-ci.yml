name: rewrite-ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Verify rewrite trunk base is available
        run: git rev-parse --verify 'origin/rewrite-main^{commit}'
      - name: Structural checks and checker self-tests
        env:
          BASE_REF: origin/rewrite-main
        run: scripts/check-all.sh
      - name: Base-diff regression checks
        run: scripts/check-base-diff.sh . origin/rewrite-main
      - name: Build production root
        run: lake build
