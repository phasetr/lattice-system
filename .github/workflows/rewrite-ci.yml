name: rewrite-ci

on:
  pull_request:
    branches: [rewrite-main]
  push:
    branches: [rewrite-main]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          fetch-depth: 0
      - name: Prepare declared tools through the Lean bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        # Only native transfer, integrity assertions and extraction precede the typed Lean bootstrap.
        # This archive is the existing lean-toolchain release, not a second project toolchain.
        run: |
          tools_root=$(mktemp -d "$RUNNER_TEMP/rewrite-ci-tools-XXXXXX")
          printf 'REWRITE_CI_TOOLS=%s\n' "$tools_root" >> "$GITHUB_ENV"
          curl --disable --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 300 --output "$tools_root/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.29.0/lean-4.29.0-linux.tar.zst
          test "$(wc -c < "$tools_root/lean.tar.zst")" -eq 539746558
          printf '089f7e513ed3e9436d191f4986330c0b53809c86b5997f5eb7f25550c374fa48  %s\n' "$tools_root/lean.tar.zst" | sha256sum --check --status
          mkdir "$tools_root/lean"
          tar --zstd -xf "$tools_root/lean.tar.zst" -C "$tools_root/lean" --strip-components=1 --no-same-owner
          printf 'REWRITE_CI_BOOTSTRAP_READY=true\n' >> "$GITHUB_ENV"
          "$tools_root/lean/bin/lean" --run Checker/Bootstrap.lean --prepare "$tools_root"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # same v5 used by lean-action
        id: cache-restore
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('lakefile.toml', 'Checker/**/*.lean', 'LatticeSystem.lean', 'LatticeSystem/**/*.lean') }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Current-tree gates and input-bound checker regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: lake exe checker --ci
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # same v5 used by lean-action
        if: ${{ success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        with:
          path: .lake
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Remove owned job-local tools through the Lean bootstrap
        # A failed pre-verification transfer never authorizes execution of an incomplete runtime.
        if: ${{ always() && env.REWRITE_CI_BOOTSTRAP_READY == 'true' }}
        run: '"$REWRITE_CI_TOOLS/lean/bin/lean" --run Checker/Bootstrap.lean --cleanup'
