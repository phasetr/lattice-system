name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # lean-action's own `actions/cache/restore` and `actions/cache/save`
      # steps are gated by the single `use-github-cache` input (see
      # https://github.com/leanprover/lean-action/blob/v1/action.yml), so
      # there is no way to ask lean-action itself for "restore but don't
      # save". On pull_request runs we therefore restore the `.lake` cache
      # here (same key scheme lean-action uses internally) and then tell
      # lean-action not to touch the cache at all, so it neither restores
      # again (this step already did it) nor saves at the end of the job.
      # This avoids PR runs evicting the `main`-branch cache entry via LRU
      # in the shared 10 GB repo cache quota (see #5098).
      - uses: actions/cache/restore@v5
        if: github.event_name == 'pull_request'
        with:
          # This must be byte-identical to what lean-action renders for its own
          # cache steps: `${{ inputs.lake-package-directory }}/.lake` with the
          # default `lake-package-directory: .`, i.e. `./.lake`.
          # `actions/cache` folds the RAW `path` string into the cache "version"
          # sha256 (`@actions/cache` cacheUtils.ts `getCacheVersion`), and
          # `actions/cache@v5` only trims/drops empty entries -- it does not
          # normalise the path. So `.lake` and `./.lake` are DIFFERENT cache
          # entries even when the key string is identical.
          # An earlier revision of this step used `.lake` and missed 100% of the
          # time: run 30195931217 logged "Cache not found for input keys" and took
          # 41m44s (full 4577-job build), while run 30195910709 with `./.lake`
          # logged "Cache hit for restore-key" and took 2m04s -- same
          # actions/cache SHA, same key string, only the path differed.
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: ${{ github.event_name != 'pull_request' }}

  # API docs generation (doc-gen4 via docgen-action) is currently
  # DISABLED because it was taking unreasonably long on every push
  # to main (often >1h). The workflow rebuilds the whole mathlib
  # toolchain and then re-elaborates all source files a second time,
  # which nearly doubles the CI cost for no value the main `build`
  # job does not already provide.
  #
  # To re-enable later (once the slowness is diagnosed / mitigated),
  # simply delete this comment and uncomment the job below. Also
  # update `README.md` and `docs/index.md` to reinstate the links
  # to `https://phasetr.github.io/lattice-system/docs/`.
  #
  # docs:
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   needs: build
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: leanprover/lean-action@v1
  #     - uses: leanprover-community/docgen-action@main
